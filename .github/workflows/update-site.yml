name: Update data and publish site

# Every morning during the season: pull the latest nflverse data, recompute QER and
# power ratings, export the website's JSON files, and publish the site to GitHub Pages.
# Run it by hand from the Actions tab at any time (for example to backfill seasons).
on:
  schedule:
    - cron: "17 11 * 9-12,1,2 *"   # 11:17 UTC daily, September through February
  workflow_dispatch:
    inputs:
      seasons:
        description: "Seasons to (re)process, e.g. 2026 or 2006-2026. Blank = current season."
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: update-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Ingest and compute
        run: |
          SEASONS="${{ github.event.inputs.seasons }}"
          if [ -n "$DATABASE_URL" ]; then
            # Hosted Postgres keeps every season's results, so only refresh what's asked
            # (default: current season). Raw plays older than 2 seasons are pruned to stay
            # inside a free database tier; QER results for those seasons are kept.
            python -m qer.pipeline run ${SEASONS:+--season $SEASONS} --keep-plays 2
          else
            # No database configured: rebuild everything into a temporary SQLite file
            # (about 4 minutes). Works with zero setup; a hosted database makes it faster.
            echo "::notice::DATABASE_URL not set; rebuilding all seasons into SQLite."
            python -m qer.pipeline run --season 2006-$(python -c "from qer.pipeline import current_season; print(current_season())")
          fi

      - name: Export website data
        run: python -m qer.export

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
